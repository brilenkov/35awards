<div class="lightbox" id="lightbox" hidden>
  <div class="lightbox__backdrop" data-close-lightbox></div>
  <div class="lightbox__dialog" role="dialog" aria-modal="true" aria-label="Просмотр фотографии">
    <button class="lightbox__close" type="button" data-close-lightbox aria-label="Закрыть">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <button class="lightbox__nav lightbox__nav--prev" type="button" data-prev-photo aria-label="Предыдущая">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <button class="lightbox__nav lightbox__nav--next" type="button" data-next-photo aria-label="Следующая">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
    </button>

    <div class="lightbox__stage">
      <img id="lightboxImage" alt="">
      <div class="lightbox__counter" id="lightboxCounter"></div>
    </div>

    <aside class="lightbox__panel">
      <div class="lightbox__panel-scroll" id="lightboxPanel"></div>
    </aside>
  </div>
</div>
