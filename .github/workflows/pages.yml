name: Deploy catalog to GitHub Pages

# Before the first run, enable Pages in Settings → Pages → Source: GitHub Actions.
# After that this workflow deploys the prebuilt catalog/ directory on every push to main.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload catalog
        uses: actions/upload-pages-artifact@v3
        with:
          path: catalog

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
